# Tests use their own database so payments_db is never touched. Create it once:
#   CREATE DATABASE payments_test;
# Tables are built from the entities at the start of each run and dropped at the end.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/payments_test}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# create-drop first drops tables that may not exist yet; hide those harmless "does not exist, skipping" warnings
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR

# Requests go straight to MockMvc, not through Tomcat, so no keystore is needed
server.ssl.enabled=false
server.ssl.key-store-password=unused

spring.application.name=payment-processing-system

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
# A payment waits at most 3 seconds for another payment's lock on the same account, then fails
# with 409 instead of hanging
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

spring.jpa.properties.hibernate.format_sql=true

# Email / mobile number change
payments.contact-change.otp-validity-minutes=10
payments.contact-change.max-otp-attempts=3
# Payments above the limit are blocked for this many hours after a contact change
payments.contact-change.cooling-period-hours=24
payments.contact-change.cooling-period-limit=10000

# Customer login
payments.auth.max-login-attempts=5
payments.auth.lock-minutes=15
# Log out after 15 minutes of inactivity; keep the session cookie away from scripts and other sites
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true

# HTTPS on 8443; plain HTTP on 8080 only redirects to it
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:file:certs/keystore.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=payments
payments.http-redirect-port=8080

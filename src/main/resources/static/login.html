<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Online Banking</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="auth-page">
    <section class="card" aria-labelledby="title">
        <div class="brand"><span class="brand-mark" aria-hidden="true">PB</span>Online Banking</div>
        <h1 id="title">Log in</h1>
        <p class="subtitle">Welcome back. Log in to manage your accounts.</p>

        <div id="message" class="message" role="alert" aria-live="polite" hidden></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <label class="checkbox">
                <input type="checkbox" id="showPassword"> Show password
            </label>
            <button type="submit" class="btn-primary" id="submitButton">Log in</button>
        </form>

        <p class="switch-link">New customer? <a href="/register.html">Register for online banking</a></p>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>

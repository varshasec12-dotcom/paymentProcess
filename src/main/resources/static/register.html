<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Online Banking</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="auth-page">
    <section class="card wide" aria-labelledby="title">
        <div class="brand"><span class="brand-mark" aria-hidden="true">PB</span>Online Banking</div>
        <h1 id="title">Create your account</h1>
        <p class="subtitle">Register for online banking in a minute.</p>

        <div id="message" class="message" role="alert" aria-live="polite" hidden></div>

        <form id="registerForm" novalidate>
            <div class="field-row">
                <div class="field">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
                </div>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="phoneNumber">Mobile number</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" autocomplete="tel" required>
                <p class="hint">10 to 15 digits, optionally starting with +</p>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password"
                       aria-describedby="passwordHint" required>
                <p class="hint" id="passwordHint">
                    At least 8 characters, with an uppercase letter, a lowercase letter, a number and a special character
                </p>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
            </div>
            <label class="checkbox">
                <input type="checkbox" id="showPassword"> Show passwords
            </label>
            <button type="submit" class="btn-primary" id="submitButton">Register</button>
        </form>

        <p class="switch-link">Already registered? <a href="/login.html">Log in</a></p>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
